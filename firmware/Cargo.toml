cargo-features = ["per-package-target"]

[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
license = "mit"
forced-target = "thumbv7em-none-eabihf"

[dependencies]
rtt-target.workspace = true
panic-rtt-target.workspace = true

cortex-m.workspace = true
cortex-m-rt.workspace = true
rtic.workspace = true

mipidsi.workspace = true
embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-bus.workspace = true

stm32f1xx-hal.workspace = true

format_no_std.workspace = true

peripherals.workspace = true
graphics.workspace = true

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "hw"
path = "src/hw.rs"
test = false
bench = false

[[bin]]
name = "unlock_ram"
path = "src/unlock_ram.rs"
test = false
bench = false

[[bin]]
name = "lock_ram"
path = "src/lock_ram.rs"
test = false
bench = false

[[bin]]
name = "fps"
path = "src/fps.rs"
test = false
bench = false
