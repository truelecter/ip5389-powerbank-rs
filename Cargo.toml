cargo-features = ["per-package-target"]

[workspace]
members = [
  "firmware",
  # "emulation",
  "graphics",
  "peripherals"
]
exclude = ["vendor"]
resolver = "2"

[workspace.dependencies]
rtt-target = "0.6.2"
panic-rtt-target = "0.2.0"

cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
rtic = { version = "2.3.1", features = ["thumbv7-backend"] }

# `batch` groups `draw_iter` pixels into rows and blocks, one address window each
mipidsi = { version = "0.10.0", default-features = false, features = ["batch"] }
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-layout = "0.4.2"

# stm32f1xx-hal 0.11 patched for the AT32F403A clock tree (PLL up to 240 MHz)
stm32f1xx-hal = { path = "vendor/stm32f1xx-hal", features = ["at32f403a", "medium"] }

byteorder = { version = "1.5.0", default-features = false }
format_no_std = "1.2.0"
ryu = "1.0.23"
numtoa = "1.0.1"
micromath = "2.1.0"
packed_struct = { version = "0.12.0", default-features = false }

peripherals = { path = "peripherals" }
graphics = { path = "graphics" }

[profile.dev]
opt-level = 0
codegen-units = 16
debug = true
lto = false
# build-override.opt-level = 0
# build-override.debug = 2

[profile.release]
opt-level = "s"   # optimize for size
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations
